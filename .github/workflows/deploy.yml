name: Test and publish backend

on: # Defines the event that triggers workflow.
  pull_request:
  push:

permissions:
  contents: read # Gives the workflow permission to read and download repository source code.

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: persona_test
          POSTGRES_PASSWORD: persona_test
          POSTGRES_DB: persona_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U persona_test -d persona_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://persona_test:persona_test@127.0.0.1:5432/persona_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install application and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit and PostgreSQL API tests
        run: python -m pytest --junitxml=test-results/backend.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/
          if-no-files-found: ignore

  build-and-push:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Serialize publication of the same commit, including workflow reruns.
    concurrency:
      group: ghcr-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install registry tools
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Check publish-once safeguards
        run: python3 -m unittest discover -s scripts -p test_publish_image.py
      - name: Publish once or reuse the existing commit image
        env:
          VITE_CDN_BASE: ${{ vars.VITE_CDN_BASE }}
        run: python3 scripts/publish_image.py
      - uses: actions/upload-artifact@v4
        with:
          name: ghcr-image-${{ github.sha }}
          path: image.json
          retention-days: 90
