name: Test and publish backend

on: # Defines the event that triggers workflow.
  pull_request:
  push:

permissions:
  id-token: write  # Grants GitHub permission to request a short-lived JWT from GitHub OIDC provider.
  contents: read # Gives the workflow permission to read and download repository source code.

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: persona_test
          POSTGRES_PASSWORD: persona_test
          POSTGRES_DB: persona_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U persona_test -d persona_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://persona_test:persona_test@127.0.0.1:5432/persona_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install application and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit and PostgreSQL API tests
        run: python -m pytest --junitxml=test-results/backend.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/
          if-no-files-found: ignore

  build-and-push:
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'trial')
    runs-on: ubuntu-latest # Tells GitHub to spin up a fresh, virtual Linux (Ubuntu) virtual machine hosted by GitHub to run these steps.

    steps: # list of commands to run sequentially inside the VM
      - name: Checkout Code # just a name as an indicator for reader
        uses: actions/checkout@v4 # official GitHub action to clone project's source code into the VM's working directory

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4 # AWS's official GitHub action to authenticate
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }} # Fetches IAM Role ARN from GitHub Repository Variables and assumes that role temporarily via OIDC
          aws-region: ${{ vars.AWS_REGION }} # Fetches AWS region from GitHub Repository Variables to connect to

      - name: Log in to Amazon ECR
        id: login-ecr # Gives this step a name so the next step can reference its output
        uses: aws-actions/amazon-ecr-login@v2 # AWS's action to log the VM's local Docker daemon into private Amazon ECR registry

      - name: Build, Tag, and Push Image
        env: # Defines temporary environment variables for this specific step
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}  # Reads the registry URL generated by previous Step (login-ecr).
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }} # Reads repository name from GitHub Variable
          IMAGE_TAG: ${{ github.sha }} # Git commit hash to ensure every single build gets a unique tag (e.g., a1b2c3d...).
        run: |
          BRANCH_TAG=${{ github.ref_name }}
          docker build --label org.opencontainers.image.revision=${{ github.sha }} --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH_TAG
